[package]
name = "dshub"
version = "0.2.4"
description = "DSHub Device Monitor"
authors = ["Sofian Jafar <skjafar@gmail.com>"]
license = "MIT"
repository = "https://github.com/skjafar/dshub"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri's own convention: `cargo tauri build` passes `--features
# custom-protocol`, `cargo tauri dev` does not. Declared here so
# `cargo build --features custom-protocol` (no tauri-cli needed) also
# produces a build that loads over the custom-protocol origin, exactly as
# `cargo tauri build` does — used by `.scratch/daughter-windows-native`
# issue 01's spike to test against a packaged binary without a full bundle.

custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3" }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
if-addrs = "0.13"
base64 = "0.22"
