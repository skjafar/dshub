<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The document a Daughter Window is opened onto.

         Deliberately empty of script. A Daughter Window is not a second copy of
         the application: dockview opens this page with `window.open`, then adopts
         the popped-out group's live DOM into it and copies the opener's
         stylesheets across. The React tree, the DSHub context and the poll
         registry all stay in the Main Window's realm (ADR 0004), so anything
         this page loaded for itself would be a second copy of exactly what that
         decision exists to avoid.

         `html, body { height: 100% }` is load-bearing rather than cosmetic: the
         adopted container sizes itself against the body, and without it the
         window opens with its grid collapsed to zero height.

         Two elements end up in this body, from two different sources, and this
         stylesheet is what makes them stack rather than overlap: `body` itself
         (a `DaughterWindowRoot.tsx`, portalled in by `AppShell.tsx` — the one
         piece of UI that actually renders here rather than having its DOM
         relocated here) inserted as the first child, and `.dv-popout-window`
         (dockview's own adopted container, class name owned by the library)
         appended after it. `body { display: flex; flex-direction: column }`
         plus `.dv-popout-window { flex: 1 1 auto }` is the whole layout: the
         chrome bar takes its own height, the dock fills what is left. -->
    <title>DSHub</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .dv-popout-window {
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>
  <body></body>
</html>
