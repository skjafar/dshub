name: Native Rust Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Linux package
        if: runner.os == 'Linux'
        run: bash build.sh pkg
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/dshub.exe,LICENSE -DestinationPath dshub-windows.zip
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        run: tar -czf dshub-${{ matrix.label }}.tar.gz -C target/release dshub -C ../.. LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: dshub-${{ matrix.label }}
          path: |
            dshub-*.zip
            dshub-*.tar.gz
            target/package/*.deb
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dshub-*.zip
            dshub-*.tar.gz
            target/package/*.deb
