name: Native Rust Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Advisories, licences and crate sources. Its own job, so a new advisory
  # is visible without blocking a build.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources

  build:
    permissions:
      # Only a tagged run publishes a release.
      contents: ${{ startsWith(github.ref, 'refs/tags/v') && 'write' || 'read' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Emulator integration (TCP/UDP on loopback)
        if: runner.os == 'Linux'
        run: cargo test --locked --test emulator -- --ignored
      - name: Slow link (Linux)
        if: runner.os == 'Linux'
        run: cargo test --locked --test slow_link -- --ignored
      - name: Protocol conformance (Linux)
        if: runner.os == 'Linux'
        run: cargo test --locked --test conformance -- --ignored
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release
      - name: Linux package
        if: runner.os == 'Linux'
        run: bash build.sh pkg
      - name: Sign Windows binary
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No signing certificate configured; skipping"; exit 0 }
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          & $signtool.FullName sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 target/release/dshub.exe
          Remove-Item certificate.pfx
      - name: macOS app bundle (signed and notarized when configured)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/bundle.sh
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/dshub.exe,LICENSE -DestinationPath dshub-windows.zip
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        run: tar -czf dshub-${{ matrix.label }}.tar.gz -C target/release dshub -C ../.. LICENSE
      - name: Checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(dshub-*.zip dshub-*.tar.gz target/package/*.deb)
          if command -v sha256sum >/dev/null; then
            sha256sum "${files[@]}" > dshub-${{ matrix.label }}.sha256
          else
            shasum -a 256 "${files[@]}" > dshub-${{ matrix.label }}.sha256
          fi
          cat dshub-${{ matrix.label }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dshub-${{ matrix.label }}
          path: |
            dshub-*.zip
            dshub-*.tar.gz
            dshub-*.sha256
            target/package/*.deb
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dshub-*.zip
            dshub-*.tar.gz
            dshub-*.sha256
            target/package/*.deb
