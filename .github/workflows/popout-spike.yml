name: Popout Mechanism Spike

# Issue 01 (see .scratch/daughter-windows/issues/01-popout-mechanism-spike.md):
# does dockview's popout mechanism survive Tauri's webview on every platform
# the build matrix targets? Windows is already confirmed by hand (see ADR
# 0004's amendment) — this job is what establishes Linux and macOS, which
# nobody on this project can drive directly.
#
# Manual trigger only. This does not run on every push: it builds a
# spike-enabled binary that is deliberately never what a tagged release
# produces, and running three platforms' worth of builds on every commit
# would be waste for a check that, once each platform has a real verdict, has
# nothing left to say.
on:
  workflow_dispatch:

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            xdotool

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Baked in via the env var alone (see `client/src/index.tsx`) — this is
      # deliberately a production-shaped build (`--features custom-protocol`
      # below), not `npm run dev`, because the question is whether the popout
      # mechanism survives Tauri's real production origin: the custom
      # protocol on Windows, or the phase-2 localhost server everywhere else.
      - name: Build frontend with the spike enabled
        env:
          VITE_DSHUB_SPIKE: popout
        run: |
          npm --prefix client ci
          npm --prefix client run build

      # `--features custom-protocol` is what flips `lib.rs`'s `dev`/`not(dev)`
      # cfg to the production branch — the same feature `cargo tauri build`
      # passes, without needing tauri-cli installed just to produce a
      # runnable binary for this job.
      - name: Build the spike binary
        working-directory: src-tauri
        run: cargo build --features custom-protocol

      - name: Run the spike and capture its verdict (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            ./target/debug/dshub > ../spike-output.log 2>&1 &
            pid=$!
            sleep 4
            xdotool search --name "DSHub" windowactivate --sync
            sleep 1
            xdotool key --clearmodifiers Return
            sleep 3
            kill "$pid" 2>/dev/null || true
          '

      - name: Run the spike and capture its verdict (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\target\debug\dshub.exe -PassThru -RedirectStandardOutput ..\spike-output.log -RedirectStandardError ..\spike-output-err.log
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName Microsoft.VisualBasic
          [Microsoft.VisualBasic.Interaction]::AppActivate($proc.Id) | Out-Null
          Start-Sleep -Milliseconds 500
          Add-Type -AssemblyName System.Windows.Forms
          # The probe button is focused on mount (`PopoutSpike.tsx`), so a
          # bare Enter is a real, position-independent OS-level keypress —
          # no coordinate guessing, unlike a synthesized click.
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep -Seconds 3
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path ..\spike-output-err.log) { Get-Content ..\spike-output-err.log | Add-Content ..\spike-output.log }

      - name: Run the spike and capture its verdict (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          ./target/debug/dshub > ../spike-output.log 2>&1 &
          pid=$!
          sleep 4
          # Best-effort only: GitHub-hosted macOS runners do not grant the
          # Accessibility permission System Events needs for synthetic
          # keystrokes, and there is no non-interactive way to grant it. If
          # this silently does nothing, the auto (no-gesture) result below is
          # still meaningful on its own.
          osascript -e 'tell application "System Events" to keystroke return' || true
          sleep 3
          kill "$pid" 2>/dev/null || true

      - name: Report the verdict
        if: always()
        shell: bash
        run: |
          echo "## Popout spike — ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f spike-output.log ]; then
            echo "No output captured — the binary likely failed to start. See the build step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -q "DSHUB_SPIKE_RESULT" spike-output.log; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep "DSHUB_SPIKE_RESULT" spike-output.log | sed 's/^.*DSHUB_SPIKE_RESULT //' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No DSHUB_SPIKE_RESULT line found. Full output:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 spike-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popout-spike-${{ matrix.label }}
          path: spike-output.log
          if-no-files-found: warn
