# cargo-deny configuration, run by the "audit" job in CI.

[advisories]
# Fail on vulnerabilities and unsound crates; report unmaintained ones.
unmaintained = "workspace"

[licenses]
# Every licence the dependency tree used when this file was written.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSL-1.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    # Bundled fonts in epaint's default font data.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[sources]
# Crates come from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
